name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t avr22/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true avr22/react-test npm test

      - run: docker build -t avr22/multi-client ./client
      - run: docker build -t avr22/multi-nginx ./nginx
      - run: docker build -t avr22/multi-server ./server
      - run: docker build -t avr22/multi-worker ./worker

      - run: docker push avr22/multi-client
      - run: docker push avr22/multi-nginx
      - run: docker push avr22/multi-server
      - run: docker push avr22/multi-worker
